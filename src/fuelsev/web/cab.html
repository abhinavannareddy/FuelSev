<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fuelsev · Cab display</title>
<style>
:root{--bg:#05080b;--panel:#0d141b;--line:#1b2733;--text:#f2f6fa;--muted:#7d8ea0;--green:#3ddc84;--amber:#ffb629;--red:#ff4d4d;--blue:#4da3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,"Segoe UI Variable","Segoe UI",Inter,Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Telugu","Nirmala UI",sans-serif;
  display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:16px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;font-size:15px}
.bar b{color:var(--text);font-size:18px}
.bar .sp{flex:1}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px}
.chip.ok{color:var(--green)}.chip.no{color:var(--amber)}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.35fr);gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;position:relative;min-height:0}
.speedcard{display:grid;place-items:center}
.big{position:relative;width:min(100%,380px);aspect-ratio:1}
.big svg{width:100%;height:100%;transform:rotate(135deg)}
.big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big .c b{font-size:clamp(72px,13vw,132px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big .c i{font-style:normal;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-top:6px}
.sign{position:absolute;top:14px;right:14px;width:68px;height:68px;border-radius:50%;background:#fff;border:7px solid #d8232a;display:grid;place-items:center;color:#111;font-weight:800;font-size:25px}
.sign.none{opacity:.2}
.msg{display:flex;flex-direction:column;justify-content:center;gap:12px;border-width:2px;transition:border-color .2s,background .2s}
.msg .lab{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.msg .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--green);color:#042a14;font-size:20px;font-weight:900}
.msg .text{font-size:clamp(30px,4.6vw,58px);font-weight:800;line-height:1.12;letter-spacing:-.015em;overflow-wrap:anywhere}
.msg.p1{border-color:var(--red);background:linear-gradient(180deg,rgba(255,77,77,.16),var(--panel))}.msg.p1 .ic{background:var(--red);color:#fff}
.msg.p2{border-color:var(--amber);background:linear-gradient(180deg,rgba(255,182,41,.14),var(--panel))}.msg.p2 .ic{background:var(--amber);color:#2c1d00}
.msg.p3{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.msg.idle .text{color:var(--muted);font-weight:700}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.tile .a{font-size:12.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.tile .b{font-size:clamp(26px,3.6vw,42px);font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .b small{font-size:.45em;color:var(--muted);margin-left:4px;letter-spacing:0}
.tile .b.warn{color:var(--amber)}.tile .b.bad{color:var(--red)}.tile .b.good{color:var(--green)}
.tiny{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.tiny i{display:block;height:100%;background:var(--blue)}
@media (max-width:760px){main{grid-template-columns:1fr}.row{grid-template-columns:repeat(2,1fr)}body{overflow:auto}}
</style>
</head>
<body>
<div class="bar"><b id="mid">HT-01</b><span id="route"></span><span class="sp"></span><span class="chip" id="link">connecting</span><span class="chip" id="clock"></span></div>
<main>
  <section class="card speedcard"><div class="sign none" id="sign">–</div>
    <div class="big" id="big"></div></section>
  <section class="card msg idle" id="msg"><div class="lab"><span class="ic" id="ic">✓</span><span id="lab">Cab display</span></div><div class="text" id="text">Driving well. Keep it smooth.</div></section>
</main>
<div class="row">
  <div class="tile"><div class="a">Gear</div><div class="b" id="gear">–</div></div>
  <div class="tile"><div class="a">Engine</div><div class="b" id="rpm">–<small>rpm</small></div></div>
  <div class="tile"><div class="a">Fuel rate</div><div class="b" id="lph">–<small>L/h</small></div></div>
  <div class="tile"><div class="a">Coolant</div><div class="b" id="cool">–<small>°C</small></div></div>
  <div class="tile"><div class="a">Tank</div><div class="b" id="tank">–<small>L</small></div><div class="tiny"><i id="tankbar" style="width:0"></i></div></div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s), q = new URLSearchParams(location.search);
const mid = q.get("machine") || "HT-01"; $("#mid").textContent = mid;
let key = ""; try { key = q.get("key") || sessionStorage.getItem("fuelsev-key") || ""; } catch (e) {}
const H = key ? {"X-API-Key": key} : {};
const get = p => fetch(p, {headers: H}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const ROUTES = {ghat_climb:"Ghat climb", ghat_descent:"Ghat descent", monsoon_site:"Monsoon site", nh_corridor:"NH corridor", quarry_haul:"Quarry haul", urban_mixed:"Urban mixed"};
const LAB = {en:"Coach", hi:"कोच", te:"కోచ్"}, IC = {1: "!", 2: "⚠", 3: "↗"};
function dial(v, lim) {
  const R = 52, C = 2 * Math.PI * R, arc = C * .75, f = Math.max(0, Math.min(1, v / 100));
  const col = lim && v > lim * 1.05 ? "var(--red)" : lim && v > lim * .93 ? "var(--amber)" : "var(--green)";
  return `<svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${arc} ${C}"/>
  <circle cx="65" cy="65" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${arc * f} ${C}" style="transition:stroke-dasharray .4s"/></svg>
  <div class="c"><b>${Math.round(v)}</b><i>KM/H</i></div>`;
}
let lastCoach = 0, shown = null;
async function tick() {
  try {
    const [t, c] = await Promise.all([get(`/telemetry/${encodeURIComponent(mid)}/latest`), get(`/coach/${encodeURIComponent(mid)}?limit=1`)]);
    $("#route").textContent = (ROUTES[t.route_id] || t.route_id) + " · " + t.leg;
    $("#big").innerHTML = dial(t.speed_kmh, t.speed_limit_kmh);
    const s = $("#sign"); s.textContent = t.speed_limit_kmh ? Math.round(t.speed_limit_kmh) : "–"; s.classList.toggle("none", !t.speed_limit_kmh);
    $("#gear").textContent = t.gear || "N";
    $("#rpm").innerHTML = `${Math.round(t.rpm)}<small>rpm</small>`;
    $("#lph").innerHTML = `${t.fuel_lph.toFixed(1)}<small>L/h</small>`;
    const k = $("#cool"); k.innerHTML = `${Math.round(t.coolant_c)}<small>°C</small>`; k.className = "b " + (t.coolant_c > 104 ? "bad" : t.coolant_c > 97 ? "warn" : "");
    $("#tank").innerHTML = `${Math.round(t.fuel_level_l)}<small>L</small>`; $("#tankbar").style.width = Math.min(100, t.fuel_level_l / 4) + "%";
    const age = Date.now() / 1000 - t.ts, ok = age < 20;
    const l = $("#link"); l.textContent = ok ? "● LIVE" : "NO SIGNAL"; l.className = "chip " + (ok ? "ok" : "no");
    const m = c[0], box = $("#msg");
    if (m && Date.now() / 1000 - m.ts < 12) {
      box.className = "card msg p" + m.priority; $("#ic").textContent = IC[m.priority] || "↗";
      $("#lab").textContent = LAB[m.lang] || LAB.en; $("#text").textContent = m.text;
    } else if (!m || Date.now() / 1000 - m.ts >= 12) {
      box.className = "card msg idle"; $("#ic").textContent = "✓"; $("#lab").textContent = "Cab display"; $("#text").textContent = "Driving well. Keep it smooth.";
    }
  } catch (e) { $("#link").textContent = "OFFLINE"; $("#link").className = "chip no"; }
}
setInterval(() => { $("#clock").textContent = new Date().toLocaleTimeString("en-GB"); }, 1000);
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
