# One command: docker compose up --build
# Broker, supervisor API and two simulated machines (one on a ghat road, one on an NH corridor).

x-machine: &machine
  build: .
  image: fuelsev:latest
  restart: unless-stopped
  depends_on:
    broker:
      condition: service_healthy
  environment:
    FUELSEV_MQTT_HOST: broker

services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: fuelsev:latest
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      broker:
        condition: service_healthy
    environment:
      FUELSEV_MQTT_HOST: broker
      FUELSEV_DB_PATH: /data/fuelsev.db
      # FUELSEV_API_KEY: change-me     # uncomment to require the X-API-Key header
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  machine-1:
    <<: *machine
    command: ["machine", "--id", "HT-01", "--route", "ghat_descent", "--driver", "aggressive", "--lang", "te",
              "--speedup", "30", "--model", "/app/models/anomaly.joblib", "--outage", "900-1500", "--fault", "overheat@2400"]

  machine-2:
    <<: *machine
    command: ["machine", "--id", "HT-02", "--route", "nh_corridor", "--driver", "typical", "--lang", "hi",
              "--speedup", "30", "--model", "/app/models/anomaly.joblib", "--seed", "1"]

volumes:
  mosquitto-data:
  api-data:
